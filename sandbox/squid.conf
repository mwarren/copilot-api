# Copilot API Proxy - Squid Egress Allowlist
# Only allows connections to GitHub, Copilot, and Anthropic endpoints.
# All other outbound traffic is denied and logged.

# --- ACL Definitions ---

# Allowed destination domains (HTTPS CONNECT and HTTP)
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubcopilot.com
acl allowed_domains dstdomain api.anthropic.com

# Standard port ACLs
acl SSL_ports port 443
acl Safe_ports port 443

# Method ACLs
acl CONNECT method CONNECT

# --- Access Rules ---

# Deny non-safe ports
http_access deny !Safe_ports

# Deny CONNECT to non-SSL ports
http_access deny CONNECT !SSL_ports

# Allow CONNECT (HTTPS) to allowed domains only
http_access allow CONNECT allowed_domains

# Allow HTTP to allowed domains only
http_access allow allowed_domains

# Deny everything else
http_access deny all

# --- Listener ---
http_port 3128

# --- Privacy / Hardening ---

# Don't reveal internal network info
forwarded_for delete
via off

# Suppress Squid version in error pages
httpd_suppress_version_string on

# --- Logging ---
# Log denied requests for auditing (stdout for Docker)
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

# Minimal cache (we're a filtering proxy, not a caching proxy)
cache deny all

# DNS settings - use Docker's resolver
dns_nameservers 127.0.0.11

# Timeout tuning for long-lived SSE streams
read_timeout 10 minutes
client_lifetime 30 minutes
connect_timeout 30 seconds
