# Sandboxed deployment of copilot-api
#
# Network topology:
#   client ---> nginx (ingress + restricted) ---> copilot-api (restricted) ---> squid (restricted + egress) ---> internet
#
# Three networks provide layered isolation:
#   - ingress: non-internal, allows clients on the host to reach nginx via published ports
#   - restricted: internal-only network for nginx <-> copilot-api <-> squid
#   - egress: allows squid (and only squid) to reach the internet
#
# copilot-api is ONLY on the restricted (internal) network. It cannot reach
# the internet directly. All outbound traffic is forced through squid, which
# enforces a strict domain allowlist.
#
# Usage:
#   docker compose -f sandbox/docker-compose.sandbox.yml up --build
#
# Requires GH_TOKEN env var (run `copilot-api auth` locally first to get one,
# or set it in a .env file alongside this compose file).

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${COPILOT_API_PORT:-4141}:4141"
    networks:
      - ingress
      - restricted
    depends_on:
      - copilot-api
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true

  squid:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - restricted
      - egress
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 -p 3128 mgr:info | grep -q 'Connection information'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Drop all capabilities except what squid needs
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/spool/squid:size=64m
      - /var/log/squid:size=16m
      - /var/run:size=1m

  copilot-api:
    build:
      context: ..
      dockerfile: Dockerfile
    # No published ports -- only reachable via nginx on the restricted network
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - COPILOT_API_HOME=/data
      # Route ALL traffic through the squid proxy
      - HTTPS_PROXY=http://squid:3128
      - HTTP_PROXY=http://squid:3128
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - copilot-data:/data
    networks:
      - restricted
    # ONLY on restricted (internal) network -- no internet access
    depends_on:
      squid:
        condition: service_healthy
    # Drop all capabilities
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Security options
    security_opt:
      - no-new-privileges:true

volumes:
  copilot-data:
    # Persists github_token and config.json across container restarts

networks:
  ingress:
    # Non-internal so published ports work. Only nginx is exposed here.
  restricted:
    # internal: true means containers on this network CANNOT reach
    # external networks. This is the key security control.
    internal: true
  egress:
    # Normal network -- only squid is on this network
