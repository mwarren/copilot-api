# Sandboxed deployment of copilot-api
#
# Network topology:
#   copilot-api (restricted) ---> squid (restricted + egress) ---> internet
#
# The "restricted" network has internal: true, meaning containers on it
# cannot reach the internet directly. The only path out is through squid,
# which enforces a strict domain allowlist.
#
# Usage:
#   docker compose -f sandbox/docker-compose.sandbox.yml up --build
#
# Requires GH_TOKEN env var (run `copilot-api auth` locally first to get one,
# or set it in a .env file alongside this compose file).

services:
  squid:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - restricted
      - egress
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 -p 3128 mgr:info | grep -q 'Connection information'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Drop all capabilities except what squid needs
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/spool/squid:size=64m
      - /var/log/squid:size=16m
      - /var/run:size=1m

  copilot-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${COPILOT_API_PORT:-4141}:4141"
    environment:
      - GH_TOKEN=${GH_TOKEN}
      - COPILOT_API_HOME=/data
      # Route ALL traffic through the squid proxy
      - HTTPS_PROXY=http://squid:3128
      - HTTP_PROXY=http://squid:3128
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - copilot-data:/data
    networks:
      - restricted
    # NO egress network -- copilot-api cannot reach the internet directly
    depends_on:
      squid:
        condition: service_healthy
    # Drop all capabilities
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Security options
    security_opt:
      - no-new-privileges:true

volumes:
  copilot-data:
    # Persists github_token and config.json across container restarts

networks:
  restricted:
    # internal: true means containers on this network CANNOT reach
    # external networks. This is the key security control.
    internal: true
  egress:
    # Normal network -- only squid is on this network
